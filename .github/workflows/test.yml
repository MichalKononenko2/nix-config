name: "Test"

on:
  pull_request:


jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - uses: cachix/cachix-action@v14
        with:
          name: mkononenko-nix-config
      - run: nix flake check
      - run: nix build .#docs

